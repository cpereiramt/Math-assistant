name: Deploy to Google Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloud-run
    concurrency:
      group: math-assistant-cloud-run
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      OAUTH_GOOGLE_REDIRECT_URI: ${{ vars.OAUTH_GOOGLE_REDIRECT_URI }}
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
      APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
      MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE }}
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '3600000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          for key in GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY \
              CLOUD_RUN_SERVICE CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT OAUTH_GOOGLE_REDIRECT_URI \
              FRONTEND_BASE_URL APP_CORS_ALLOWED_ORIGINS MONGODB_DATABASE; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Configure $key in the cloud-run environment."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Gradle tests
        run: bash ./gradlew --no-daemon test

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and publish image
        id: image
        shell: bash
        run: |
          registry="$GCP_REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPOSITORY/math-assistant:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build --tag "$image" .
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --update-env-vars "^|^SPRING_APPLICATION_NAME=MathExpAssistant|USE_AWS_SECRETS=false|JWT_EXPIRATION=$JWT_EXPIRATION|MONGODB_DATABASE=$MONGODB_DATABASE|OAUTH_GOOGLE_REDIRECT_URI=$OAUTH_GOOGLE_REDIRECT_URI|FRONTEND_BASE_URL=$FRONTEND_BASE_URL|APP_CORS_ALLOWED_ORIGINS=$APP_CORS_ALLOWED_ORIGINS" \
            --update-secrets "MONGO_URI=math-assistant-mongo-uri:latest,JWT_SECRET=math-assistant-jwt-secret:latest,OAUTH_GOOGLE_CLIENT_ID=math-assistant-google-client-id:latest,OAUTH_GOOGLE_CLIENT_SECRET=math-assistant-google-client-secret:latest,ADMIN_CREDS=math-assistant-admin-creds:latest" \
            --quiet
