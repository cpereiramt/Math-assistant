plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.claySoftware'
version = '2.4.0'

java {
	sourceCompatibility = '21'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.h2database:h2:2.2.224'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
	implementation 'org.springframework.boot:spring-boot-starter-actuator:3.2.5'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt:0.9.1'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
	implementation 'com.ezylang:EvalEx:3.6.2'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0"
	// for resilience4j
	implementation "org.springframework.boot:spring-boot-starter-aop"
	implementation platform("io.github.resilience4j:resilience4j-bom:2.2.0")

    implementation "io.github.resilience4j:resilience4j-spring-boot3"
	implementation "io.github.resilience4j:resilience4j-micrometer"
	implementation "io.micrometer:micrometer-registry-prometheus"
	// AWS SDK for Secrets Manager
	implementation 'software.amazon.awssdk:secretsmanager:2.20.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation:2.2.1.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.3.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
