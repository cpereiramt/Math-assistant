spring.application.name=${SPRING_APPLICATION_NAME}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://math-assistant.claytonpereira.com,http://localhost:3000,http://localhost:5173,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4200}

# OAuth (Google) - prefer setting OAUTH_GOOGLE_* env vars in prod
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope= openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.port=${MONGODB_PORT}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.username=${MONGODB_USERNAME}
spring.data.mongodb.password=${MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB}
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


springdoc.api-docs.path: /docs/v3/api-docs
springdoc.swagger-ui.path: /docs
springdoc.swagger-ui.disable-swagger-default-url: true
management.endpoints.web.exposure.include: health,info
endpoint.health.show-details: when_authorized


# ===============================
# Resilience4j - RateLimiter
# ===============================
resilience4j.ratelimiter.instances.publicApi.limitForPeriod=100
resilience4j.ratelimiter.instances.publicApi.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.publicApi.timeoutDuration=0

resilience4j.ratelimiter.instances.login.limitForPeriod=10
resilience4j.ratelimiter.instances.login.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.login.timeoutDuration=0

# ===============================
# Resilience4j - Bulkhead (Semaphore)
# ===============================
resilience4j.bulkhead.instances.publicApi.maxConcurrentCalls=100
resilience4j.bulkhead.instances.publicApi.maxWaitDuration=0

# ===============================
# Resilience4j - ThreadPoolBulkhead
# ===============================
resilience4j.thread-pool-bulkhead.instances.externalCalls.coreThreadPoolSize=20
resilience4j.thread-pool-bulkhead.instances.externalCalls.maxThreadPoolSize=50
resilience4j.thread-pool-bulkhead.instances.externalCalls.queueCapacity=200

# ===============================
# Resilience4j - CircuitBreaker
# ===============================
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=50
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=20
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=10
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.recordExceptions[0]=java.io.IOException
resilience4j.circuitbreaker.configs.default.recordExceptions[1]=java.net.SocketTimeoutException
resilience4j.circuitbreaker.configs.default.recordExceptions[2]=org.springframework.web.client.ResourceAccessException

resilience4j.circuitbreaker.instances.dbOrExternal.baseConfig=default

# ===============================
# Resilience4j - TimeLimiter
# ===============================
resilience4j.timelimiter.instances.externalCalls.timeoutDuration=2s
resilience4j.timelimiter.instances.externalCalls.cancelRunningFuture=true
